<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>中咨养护检测项目与费用管理</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="app" class="app">
  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">中</div>
      <div class="brand-text">
        <div class="brand-title">中咨养护检测</div>
        <div class="brand-sub">项目与费用管理</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a class="nav-item active" data-view="dashboard">概览仪表盘</a>
      <a class="nav-item" data-view="projects">项目管理</a>
      <a class="nav-item" data-view="attendance">人员考勤</a>
      <a class="nav-item" data-view="monthly">月度执行情况</a>
      <a class="nav-item" data-view="personnel">人员台账</a>
      <a class="nav-item" data-view="achievements">成果管理</a>
      <a class="nav-item" data-view="io">数据导入导出</a>
    </nav>
    <div class="sidebar-foot">
      <div class="company-name" id="companyName">xxx分公司</div>
      <div class="version">v1.0 · 本地存储</div>
    </div>
  </aside>

  <!-- 主区 -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn only-mobile" id="menuToggle" aria-label="菜单">☰</button>
        <h1 id="viewTitle">概览仪表盘</h1>
      </div>
      <div class="topbar-right">
        <label class="month-pick">
          <span class="month-pick-label">上报月份</span>
          <input type="month" id="currentMonth" />
        </label>
      </div>
    </header>

    <section class="content" id="content">
      <!-- 视图由 JS 动态渲染 -->
    </section>
  </main>
</div>

<!-- 通用模态框容器 -->
<div class="modal-mask" id="modalMask" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modalTitle">标题</h3>
      <button class="icon-btn" id="modalClose" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<!-- 通用提示条 -->
<div class="toast" id="toast" hidden></div>

<script src="vendor/xlsx.full.min.js"></script>
<script src="js/seed.js"></script>
<script src="js/app.js"></script>
</body>
</html>
